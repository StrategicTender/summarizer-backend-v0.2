<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RFP Summarizer — Strategic Tender</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {--navy:#0a2540;--gold:#C9A227;--bg:#f8f9fa;}
    body{font-family:"Open Sans",sans-serif;background:var(--bg);margin:0;color:#222;line-height:1.6}
    .header{display:flex;align-items:center;gap:15px;padding:20px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.1)}
    .header img{height:80px}
    .header h1{margin:0;color:var(--navy);font-family:"Playfair Display",serif;font-size:28px}
    .header p{margin:0;color:#bfa14a;font-weight:700;font-size:14px}
    .hero{text-align:center;background:linear-gradient(to bottom,#FFFBEA 0%,#FFFFFF 100%);padding:50px 20px 40px;border-bottom:1px solid #e2d7b6}
    .hero h2{font-family:"Playfair Display",serif;font-size:28px;color:var(--navy);margin:0 0 10px}
    .hero p{max-width:620px;margin:0 auto;color:#444}
    .container{max-width:900px;margin:40px auto;padding:20px;text-align:center}
    input[type=file]{margin:10px 0}
    button{background:var(--navy);color:#fff;border:none;border-radius:6px;padding:10px 18px;font-weight:600;cursor:pointer;margin-left:10px}
    #spinner{display:none;margin-top:14px;color:#555}
    #output iframe{width:100%;height:1600px;border:none;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
    hr.gold{width:160px;height:4px;background:var(--gold);border:none;margin:12px auto 28px;border-radius:2px}
    footer{text-align:center;font-size:13px;color:#444;margin-top:40px;padding:30px 0 40px;background:linear-gradient(to bottom,#FFFBEA 0%,#FFFFFF 85%);border-top:2px solid var(--gold)}
  </style>
</head>
<body>
  <div class="header">
    <img src="/static/logo.jpg" alt="Strategic Tender Logo" />
    <div><h1>Strategic Tender</h1><p>Your Public Procurement Advantage</p></div>
  </div>
  <div class="hero">
    <h2>AI-Powered RFP Summarizer</h2>
    <p>Transform lengthy solicitations into a concise executive one-pager.<br>
    <span style="display:block;margin-top:8px;font-weight:600;color:#002147;font-size:1.1rem;">Upload → Analyze → Download</span></p>
  </div>
  <div class="container">
    <input type="file" id="fileInput" />
    <button id="summarize">Summarize</button>
    <div id="spinner">⏳ Analyzing document…</div>
    <div id="output"></div>
  </div>
  <hr class="gold" />
  <footer>Strategic Tender — AI Summary Tool v2 Beta</footer>

<script>
const fileInput=document.getElementById("fileInput");
const summarizeBtn=document.getElementById("summarize");
const spinner=document.getElementById("spinner");
const output=document.getElementById("output");

summarizeBtn.addEventListener("click",async()=>{
 if(!fileInput.files.length){alert("Please select a file.");return;}
 const formData=new FormData();
 formData.append("file",fileInput.files[0]);
 spinner.style.display="block";
 try{
   const res=await fetch("http://127.0.0.1:8080/v2/summarize",{method:"POST",body:formData});
   const html=await res.text();
   spinner.style.display="none";
   if(!res.ok){output.innerHTML=`<p style='color:red'>Error: ${res.status}</p>`;return;}
   output.innerHTML=`<iframe srcdoc="${html.replace(/"/g,'&quot;')}"></iframe>`;
 }catch(err){
   spinner.style.display="none";
   output.innerHTML=`<p style='color:red'>Request failed: ${err}</p>`;
 }
});
</script>
</body>
</html>
