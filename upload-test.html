<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RFP Summarizer — Strategic Tender</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    html { scroll-behavior:smooth; }
    body {
      font-family:"Open Sans",sans-serif;
      background:#f8f9fa;
      margin:0;
      padding:0;
      line-height:1.6;
      color:#222;
    }

    /* ─ Header ─ */
    .header {
      display:flex;
      align-items:center;
      gap:15px;
      padding:18px 30px;
      background:#fff;
      box-shadow:0 2px 6px rgba(0,0,0,0.08);
      position:sticky;
      top:0;
      z-index:30;
      border-bottom:3px solid #C9A22720;
    }
    .header img{height:70px;}
    .header h1{
      margin:0;
      color:#0a2540;
      font-family:"Playfair Display",serif;
      font-size:26px;
      letter-spacing:0.3px;
    }
    .header p{
      margin:0;
      color:#bfa14a;
      font-weight:600;
      font-size:15px;
    }

    /* ─ Hero section ─ */
    .hero{
      background:linear-gradient(180deg,#FFFBEA 0%,#ffffff 85%);
      text-align:center;
      padding:80px 20px 60px;
      border-bottom:2px solid #C9A22740;
    }
    .hero h2{
      font-family:"Playfair Display",serif;
      font-size:30px;
      color:#0a2540;
      margin-bottom:10px;
    }
    .hero p{
      color:#555;
      font-size:17px;
      max-width:700px;
      margin:0 auto 20px;
    }

    /* ─ Main container ─ */
    .container{
      max-width:880px;
      margin:40px auto 80px;
      padding:0 24px;
    }

    #output{
      background:#fff;
      padding:28px 36px;
      border-radius:16px;
      box-shadow:0 6px 28px rgba(0,0,0,0.08);
      transition:box-shadow .3s ease;
    }
    #output:hover{box-shadow:0 10px 36px rgba(0,0,0,0.12);}
    #spinner{display:none;margin-top:10px;text-align:center;}

    button{
      background:#0a2540;
      color:#fff;
      padding:10px 22px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      font-weight:600;
      margin-top:12px;
      transition:all .25s ease;
    }
    button:hover{
      background:#C9A227;
      color:#0a2540;
      transform:translateY(-1px);
      box-shadow:0 2px 8px rgba(201,162,39,.4);
    }

    hr.gold{
      width:160px;
      height:4px;
      background:#C9A227;
      border:none;
      margin:28px auto 40px;
      border-radius:2px;
    }

    /* ─ Summary section ─ */
    #result{
      max-width:820px;
      margin:32px auto;
      padding:32px;
      background:#fff;
      border-radius:16px;
      box-shadow:0 8px 24px rgba(0,0,0,.08);
    }
    #result h1,#result h2{font-family:"Playfair Display",serif;font-weight:700;}
    #result h1{font-size:30px;text-align:center;margin-bottom:24px;}
    #result h2{font-size:21px;margin-top:28px;margin-bottom:10px;padding-bottom:6px;border-bottom:3px solid #C9A227;}
    #result ul{margin:8px 0 16px 22px;}
    #result li{margin:6px 0;}

    .highlight{
      background:#FFF9E6;
      padding:14px 20px;
      border-radius:10px;
      margin-top:8px;
      border-left:4px solid #C9A227;
    }

    .download-buttons{
      text-align:center;
      margin-top:32px;
    }
    .download-buttons button{
      background:#0A2342;
      color:#fff;
      border:none;
      padding:10px 18px;
      border-radius:6px;
      margin:0 6px;
      cursor:pointer;
      font-weight:600;
      transition:all .3s ease;
    }
    .download-buttons button:hover{
      background:#C9A227;
      color:#0A2342;
      box-shadow:0 3px 10px rgba(201,162,39,.45);
    }

    /* ─ Footer ─ */
    footer.st-footer-gradient{
      background:linear-gradient(to bottom,#FFFBEA 0%,#FFFFFF 85%);
      border-top:2px solid #C9A227;
      padding:35px 0 40px;
      text-align:center;
      font-size:13px;
      color:#333;
      width:100%;
      box-shadow:0 -3px 8px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="strategic_tender_logo.png" alt="Strategic Tender Logo">
    <div>
      <h1>Strategic Tender</h1>
      <p>Your Public Procurement Advantage</p>
    </div>
  </div>

  <section class="hero">
    <h2>AI-Powered RFP Summarizer</h2>
    <p>Transform lengthy solicitations into a concise executive one-pager. Upload → Analyze → Download.</p>
  </section>

  <div class="container">
    <input type="file" id="fileInput">
    <button id="summarize">Summarize</button>
    <div id="spinner">⏳ Please wait…</div>
    <div id="output"></div>
  </div>

  <hr class="gold">
  <footer class="st-footer-gradient">
    <p>Strategic Tender — AI Summary Tool v2 Beta</p>
  </footer>

  <script>
    document.getElementById('summarize').addEventListener('click', async () => {
      const fileInput=document.getElementById('fileInput');
      if(!fileInput.files.length)return alert("Please select a file.");
      const file=fileInput.files[0];
      const reader=new FileReader();
      reader.onload=async function(){
        try{
          const typedarray=new Uint8Array(this.result);
          const pdf=await pdfjsLib.getDocument(typedarray).promise;
          let textContent="";
          for(let i=1;i<=pdf.numPages;i++){
            const page=await pdf.getPage(i);
            const txt=await page.getTextContent();
            textContent+=txt.items.map(s=>s.str).join(" ")+"\n";
          }
          document.getElementById("spinner").style.display="block";
          const res=await fetch("http://127.0.0.1:8080/ai/v2/summarize-file",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({filename:file.name,content:textContent})
          });
          const data=await res.json();
          document.getElementById("spinner").style.display="none";
          if(data.summary){
            const html=marked.parse(data.summary);
            document.getElementById("output").innerHTML=`
              <div id="result">${html}</div>
              <div class="download-buttons">
                <button id="downloadPdf">Download PDF</button>
                <button id="downloadDocx">Download DOCX</button>
              </div>`;
            highlightCompliance();
            attachDownloads();
            document.getElementById("result").scrollIntoView({behavior:"smooth"});
          }else if(data.error){
            document.getElementById("output").innerHTML=`<p style="color:red;">Error: ${data.error}</p>`;
          }else{
            document.getElementById("output").innerHTML="<p>No summary returned.</p>";
          }
        }catch(err){
          document.getElementById("spinner").style.display="none";
          document.getElementById("output").innerHTML=`<p style="color:red;">Request failed: ${err}</p>`;
        }
      };
      reader.readAsArrayBuffer(file);
    });

    function highlightCompliance(){
      const headings=document.querySelectorAll("#result h2");
      headings.forEach(h=>{
        if(h.textContent.includes("Compliance Checklist")){
          const next=h.nextElementSibling;
          if(next&&next.tagName==="UL"){
            const wrapper=document.createElement("div");
            wrapper.className="highlight";
            h.parentNode.insertBefore(wrapper,next);
            wrapper.appendChild(next);
          }
        }
      });
    }

    function attachDownloads(){
      const {jsPDF}=window.jspdf;
      document.getElementById("downloadPdf").addEventListener("click",async()=>{
        const resultDiv=document.getElementById("result");
        if(!resultDiv)return alert("No summary to export yet.");
        const canvas=await html2canvas(resultDiv,{scale:2,useCORS:true});
        const imgData=canvas.toDataURL("image/png");
        const pdf=new jsPDF("p","mm","a4");
        const pdfWidth=pdf.internal.pageSize.getWidth();
        const imgHeight=(canvas.height*pdfWidth)/canvas.width;
        pdf.addImage(imgData,"PNG",0,0,pdfWidth,imgHeight);
        pdf.save("Executive-One-Pager.pdf");
      });
      document.getElementById("downloadDocx").addEventListener("click",()=>{
        const resultDiv=document.getElementById("result");
        if(!resultDiv)return alert("No summary to export yet.");
        const content=`<html><head><meta charset="UTF-8"></head><body>${resultDiv.outerHTML}</body></html>`;
        const blob=window.htmlDocx.asBlob(content);
        const link=document.createElement("a");
        link.href=URL.createObjectURL(blob);
        link.download="Executive-One-Pager.docx";
        link.click();
      });
    }
  </script>
</body>
</html>
